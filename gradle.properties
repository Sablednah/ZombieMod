# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# The Neo version must agree with the Minecraft version to get a valid artifact.
neo_version=26.3.0.33-beta
# What we run on, as opposed to what we build against. 26.3 up to .36, NOT any 26.3.x: NeoForge
# 26.3.0.37-beta moved to FML 12.0.8, which renamed ModConfig.Type COMMON -> LOCAL and
# SERVER -> SYNCED, so this jar dies at load on .37+ with NoSuchFieldError. Capped by Sable's
# decision (2026-09-30) until NeoForge 26.3 goes stable; then port the rename and lift the cap.
# The bound is "37-beta", not "37": Maven orders 26.3.0.37-beta BEFORE 26.3.0.37, so a bare .37
# upper bound still admits .37-beta. Checked with maven-artifact's VersionRange.
neo_version_range=[26.3,26.3.0.37-beta)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=zombiemod
mod_name=ZombieMod ReForged
mod_license=MIT
mod_version=3.6.2
mod_group_id=com.sablednah.zombiemod
mod_authors=Sablednah
mod_description=61 zombie types with hand-built AI - cowards that flee, stalkers that watch, climbers that come over the wall - and the JSON to write your own. Bosses, hordes, infection and a per-player bestiary. Install it on the server; players join with a vanilla client and need nothing. A modern NeoForge rewrite of the 2013 ZombieMod Bukkit plugin.
