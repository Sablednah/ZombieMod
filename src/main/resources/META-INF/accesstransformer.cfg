# ZombieMod access transformers.
#
# ZombieMod applies a genus's AI to *vanilla* mob instances rather than registering its own entity
# types — a vanilla client cannot render an entity type it does not know about, and supporting
# vanilla clients is the whole point of the mod. So the goal lists and the navigator have to be
# reachable from outside Mob, at the moment the entity joins the level.
#
# goalSelector / targetSelector — protected. We clear the vanilla goals a genus replaces and add the
# ones its JSON asks for (GenusApplier).
public net.minecraft.world.entity.Mob goalSelector
public net.minecraft.world.entity.Mob targetSelector
# navigation — protected. Swapping it is how a genus borrows another mob's movement, e.g. the
# spider's WallClimberNavigation to make a climbing zombie. Mob.getNavigation() only reads it.
public net.minecraft.world.entity.Mob navigation
