# Generated at build time -- do not edit. See build.gradle's build stamp block.
# Namespaced under /zombiemod/ so it cannot collide with another mod's copy on the
# classpath, which a bare /build.properties would. Read by BuildInfo.
commit=${build_commit}
branch=${build_branch}
time=${build_time}
# version carries the +mc tag, matching the jar filename token for token. mod_version alone is
# IDENTICAL on all three Minecraft lines, so a bare version would read the same on 1.21.11 and
# 26.2 - the exact thing the stamp exists to tell apart. branch still says master-vs-feature,
# but it is empty in a source zip or a detached CI checkout, so it cannot carry this.
version=${mod_version}+mc${minecraft_version}
