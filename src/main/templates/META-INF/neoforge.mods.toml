# ZombieMod - neoforge.mods.toml (values are expanded from gradle.properties at build time).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/ZombieMod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="https://github.com/Sablednah/ZombieMod"
# Banner rather than the square lockup: the mods screen gives this a wide slot, and the full
# shield emblem shrinks to illegibility in it. The square one is the CurseForge project icon.
logoFile="zombiemod-logo.png"
# The zombie face in the wordmark is literal pixel art, and blurring it is exactly wrong.
logoBlur=false

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
